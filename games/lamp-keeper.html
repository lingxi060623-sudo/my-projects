<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>守灯人</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
/* Layout: one full-bleed lamp-lit canvas; every menu is a paper talisman floating over the night marsh */
:root{
  --night:#081216;
  --night-2:#0f1f24;
  --mist:#93b4ae;
  --mist-dim:#5d7a76;
  --lamp:#f3b65c;
  --lamp-soft:#f7d79a;
  --ember:#e0613a;
  --paper:#ecdfbd;
  --paper-2:#dcc796;
  --paper-ink:#2a1f15;
  --paper-mute:#6e5537;
  --seal:#b3362a;
  --seal-ink:#f8ecd6;
  --jade:#2f6b5e;
  --gold:#f2cf6b;
  --font-display:"Ma Shan Zheng","STXingkai","KaiTi","Kaiti SC",serif;
  --font-body:"Noto Serif SC","Songti SC","SimSun","Source Han Serif SC",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--font-body);font-size:15px;line-height:1.5;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.xpbar{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);height:6px;background:rgba(147,180,174,.12)}
#xpfill{height:100%;width:0;background:linear-gradient(90deg,var(--lamp),var(--ember));box-shadow:0 0 12px var(--lamp)}
.hud-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hud-left{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:34vw}
.lvl{font-family:var(--font-display);font-size:26px;line-height:1;color:var(--lamp-soft);text-shadow:0 0 10px rgba(243,182,92,.5)}
.hud-mid{position:absolute;left:50%;top:0;transform:translateX(-50%);text-align:center}
.clock{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.04em;line-height:1.1;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.phase{font-family:var(--font-display);font-size:17px;color:var(--mist);letter-spacing:.2em}
.hud-right{display:flex;align-items:center;gap:14px;font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:baseline;gap:5px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.stat small{font-family:var(--font-display);font-size:16px;color:var(--mist);font-weight:400}
.iconbtn{pointer-events:auto;background:rgba(8,18,22,.65);border:1px solid rgba(147,180,174,.3);border-radius:6px;padding:4px 12px;font-size:14px;color:var(--paper)}
#slots{display:flex;flex-direction:column;gap:5px}
.srow{display:flex;gap:4px;flex-wrap:wrap}
.slot{width:28px;height:28px;border-radius:4px;display:grid;place-items:center;position:relative;font-family:var(--font-display);font-size:19px;line-height:1;color:var(--seal-ink);background:var(--seal);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.slot.p{background:var(--jade)}
.slot.evo{background:linear-gradient(135deg,var(--gold),var(--ember));color:var(--paper-ink)}
.slot i{position:absolute;right:-4px;bottom:-5px;font-style:normal;font-family:var(--font-body);font-size:10px;font-weight:900;background:var(--night);color:var(--lamp-soft);border-radius:3px;padding:0 3px;line-height:14px}
#bossbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);width:min(480px,64vw);text-align:center}
.bb-name{font-family:var(--font-display);font-size:22px;color:var(--ember);text-shadow:0 0 12px rgba(224,97,58,.6);line-height:1.2}
.bb-track{height:8px;background:rgba(0,0,0,.55);border:1px solid rgba(224,97,58,.45);border-radius:2px;overflow:hidden;margin-top:4px}
#bossFill{height:100%;width:100%;background:linear-gradient(90deg,#8e2a1d,var(--ember));transition:width .15s linear}
#dashBtn{position:absolute;right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:78px;height:78px;border-radius:50%;
  pointer-events:auto;border:1px solid rgba(243,182,92,.55);background:conic-gradient(rgba(243,182,92,.38) calc(var(--cd,1)*360deg),rgba(8,18,22,.6) 0);
  font-family:var(--font-display);font-size:34px;color:var(--lamp-soft);display:none;touch-action:none}
@media (hover:none) and (pointer:coarse){#dashBtn{display:grid;place-items:center}}
@media (max-width:560px){
  .hud-left{max-width:40vw}
  .clock{font-size:20px}.phase{font-size:15px}
  .hud-right{flex-direction:column;align-items:flex-end;gap:4px}
  .lvl{font-size:22px}
  .slot{width:24px;height:24px;font-size:16px}
  #bossbar{top:calc(env(safe-area-inset-top,0px) + 96px);width:72vw}
}

#toast{position:fixed;left:50%;top:27%;transform:translate(-50%,-50%);z-index:3;font-family:var(--font-display);font-size:clamp(30px,6vw,48px);line-height:1.15;
  color:var(--lamp-soft);text-shadow:0 0 18px rgba(243,182,92,.6),0 2px 0 rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .4s;text-align:center;width:max-content;max-width:90vw}
#toast.show{opacity:1}
#toast small{display:block;margin-top:6px;font-family:var(--font-body);font-size:15px;color:var(--mist);letter-spacing:.15em;text-shadow:0 1px 6px rgba(0,0,0,.9)}
#toast.boss{color:#ff8a66;text-shadow:0 0 22px rgba(224,97,58,.75),0 2px 0 rgba(0,0,0,.6)}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:4;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;align-items:center;
  padding-top:calc(env(safe-area-inset-top,0px) + 28px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dim{background:radial-gradient(ellipse at center,rgba(8,18,22,.55),rgba(3,8,10,.9))}
.dawn{background:radial-gradient(ellipse at 50% 85%,rgba(255,196,140,.28),rgba(40,30,50,.55) 55%,rgba(8,18,22,.85))}
.btn{border:1px solid rgba(243,182,92,.55);background:rgba(8,18,22,.65);color:var(--lamp-soft);padding:11px 22px;border-radius:4px;font-size:16px;letter-spacing:.08em;transition:background .15s,transform .15s}
.btn:hover{background:rgba(243,182,92,.12)}
.btn.primary{background:linear-gradient(180deg,#f6c46e,#df8f3e);color:var(--paper-ink);border-color:transparent;font-weight:900;box-shadow:0 0 28px rgba(243,182,92,.35)}
.btn.primary:hover{transform:translateY(-1px);background:linear-gradient(180deg,#f9cf83,#e69a4a)}
.btn.ghost{border-color:rgba(147,180,174,.3);color:var(--mist);font-size:14px;padding:8px 14px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.seal{display:grid;place-items:center;background:var(--seal);color:var(--seal-ink);font-family:var(--font-display);font-weight:400;line-height:1;border-radius:4px;transform:rotate(-4deg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.sec-h{font-family:var(--font-display);font-size:24px;font-weight:400;color:var(--lamp-soft);margin:0 0 10px;letter-spacing:.12em}
.note{margin:8px 0 0;font-size:13px;color:var(--mist);max-width:62ch}

/* menu */
#menu{justify-content:flex-start}
.menu-inner{width:100%;max-width:1060px;display:flex;flex-direction:column;gap:24px;padding-block:8px}
.menu-inner>*{max-width:640px}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:clamp(72px,14vw,136px);line-height:.95;margin:0;color:var(--lamp-soft);
  text-shadow:0 0 34px rgba(243,182,92,.45),0 0 2px rgba(243,182,92,.8);letter-spacing:.04em}
.brand .tag{margin:.5em 0 0;font-size:clamp(16px,2.3vw,19px);color:var(--paper);letter-spacing:.12em;text-wrap:balance}
.brand .how{margin:.8em 0 0;font-size:14px;color:var(--mist);max-width:52ch;line-height:1.7}
#charList{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:10px}
.ch{position:relative;border:none;border-radius:2px;padding:12px 12px 11px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:1px 10px;align-items:center;
  color:var(--paper-ink);background:linear-gradient(180deg,var(--paper),var(--paper-2));box-shadow:0 8px 20px rgba(0,0,0,.45);transition:transform .15s,box-shadow .15s}
.ch:hover{transform:translateY(-2px)}
.ch .seal{grid-row:span 2;width:40px;height:40px;font-size:28px}
.ch .nm{font-weight:900;font-size:16px;line-height:1.3}
.ch .tt{font-size:12px;color:var(--paper-mute);line-height:1.35}
.ch .ds{grid-column:1/-1;font-size:12.5px;line-height:1.5;margin-top:7px;color:#4a3826}
.ch .cost{grid-column:1/-1;font-size:12.5px;font-weight:900;color:var(--seal);margin-top:4px}
.ch.sel{box-shadow:0 0 0 2px var(--lamp),0 0 26px rgba(243,182,92,.5);transform:translateY(-2px)}
.ch.locked{filter:saturate(.35) brightness(.72)}
.ch.locked .seal{background:#5a4a3a}
.ch.confirm{filter:none}
.shake{animation:shake .35s}
@media (max-width:560px){
  #charList{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ch{grid-template-columns:1fr;padding:10px}
  .ch .seal{grid-row:auto;width:34px;height:34px;font-size:24px;margin-bottom:4px}
  .ch .ds{margin-top:4px;font-size:12px}
  .brand{order:-2}.menu-actions{order:-1}
  .brand .how{font-size:13px}
}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
#nightSel{display:flex;flex-wrap:wrap;gap:6px}
.nt{min-width:64px;padding:6px 12px;border:1px solid rgba(147,180,174,.35);background:rgba(8,18,22,.55);border-radius:3px;font-family:var(--font-display);font-size:19px;color:var(--mist)}
.nt.sel{border-color:var(--lamp);color:var(--lamp-soft);background:rgba(243,182,92,.14)}
.nt:disabled{opacity:.32;cursor:not-allowed}
.menu-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.purse{font-size:15px;color:var(--mist)}
.purse b{color:var(--lamp-soft);font-size:18px;font-variant-numeric:tabular-nums;margin-left:4px}
.records{margin:0;font-size:13px;color:var(--mist-dim);line-height:1.8;font-variant-numeric:tabular-nums}
.records b{color:var(--mist);font-weight:600}
.hint{margin:0;font-size:13px;color:var(--mist-dim);letter-spacing:.06em}

/* level up */
.lu-wrap,.chest-wrap{margin:auto;display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:980px}
.lu-title{font-family:var(--font-display);font-size:clamp(36px,6vw,54px);color:var(--lamp-soft);margin:0;font-weight:400;line-height:1.1;text-shadow:0 0 20px rgba(243,182,92,.5);text-align:center}
.lu-sub{margin:-8px 0 0;color:var(--mist);letter-spacing:.14em;font-size:14px;text-align:center}
.cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;width:100%;padding-top:10px}
.card{position:relative;width:210px;min-height:252px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:24px 18px 18px;border:none;border-radius:2px;text-align:left;
  color:var(--paper-ink);background:linear-gradient(180deg,var(--paper),var(--paper-2));box-shadow:0 14px 34px rgba(0,0,0,.55);transition:transform .15s ease,box-shadow .15s ease;animation:cardIn .32s backwards}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}
.card::before{content:"";position:absolute;top:-12px;left:50%;width:2px;height:16px;background:var(--seal)}
button.card:hover,button.card:focus-visible{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 20px 40px rgba(0,0,0,.6),0 0 0 2px var(--lamp);outline:none}
.card .seal{width:54px;height:54px;font-size:38px}
.card .c-tag{font-size:12px;letter-spacing:.12em;color:var(--paper-mute);font-weight:600}
.card .c-name{font-size:21px;font-weight:900;line-height:1.2}
.card .c-desc{font-size:14px;line-height:1.65;color:#3f2f1f}
.card .c-hint{margin-top:auto;font-size:12.5px;color:var(--seal);font-weight:600}
.card .key{position:absolute;top:10px;right:12px;font-size:12px;color:#9b7f58;font-weight:600}
.card.passive .seal{background:var(--jade)}
.card.evo{background:linear-gradient(180deg,#f9e49c,#e8b04a);box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 30px rgba(242,207,107,.45)}
.card.evo .seal{background:var(--paper-ink);color:var(--gold)}
.card.supply .seal{background:#7a5a36}
@keyframes cardIn{from{transform:translateY(18px);opacity:0}}
.lu-foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media (max-width:560px){
  .cards{flex-direction:column;align-items:stretch;gap:12px}
  .card{width:100%;min-height:0;display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:3px;align-items:start;padding:16px 16px 14px}
  .card .seal{grid-row:span 4;width:48px;height:48px;font-size:32px}
  .card .c-hint{margin-top:2px}
  .card::before{display:none}
}

/* panels */
.panel{margin:auto;width:100%;max-width:600px;background:rgba(10,22,26,.92);border:1px solid rgba(147,180,174,.2);border-radius:4px;padding:26px 24px;display:flex;flex-direction:column;gap:18px}
.panel h2{font-family:var(--font-display);font-weight:400;font-size:clamp(38px,7vw,56px);line-height:1.05;margin:0;color:var(--lamp-soft);text-shadow:0 0 20px rgba(243,182,92,.4)}
.panel .lead{margin:-6px 0 0;color:var(--mist);font-size:15px;line-height:1.7}
.panel-actions{display:flex;flex-wrap:wrap;gap:10px}
.build{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));column-gap:18px}
.brow{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;padding:8px 0;border-top:1px solid rgba(147,180,174,.12)}
.brow .seal{grid-row:span 2;width:34px;height:34px;font-size:24px}
.brow.p .seal{background:var(--jade)}
.brow.evo .seal{background:linear-gradient(135deg,var(--gold),var(--ember));color:var(--paper-ink)}
.brow .t{font-weight:600}
.brow .t span{color:var(--mist);font-weight:400;font-size:13px;margin-left:6px}
.brow .d{font-size:12.5px;color:var(--mist-dim)}
.brow .d b{color:var(--lamp-soft);font-weight:600}
.end-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.end-stats div{display:flex;flex-direction:column;gap:2px}
.end-stats b{font-size:26px;font-variant-numeric:tabular-nums;color:var(--paper);line-height:1.1}
.end-stats span{font-size:12px;color:var(--mist);letter-spacing:.1em}
.end-stats em{font-style:normal;font-size:11px;color:var(--gold);letter-spacing:.06em}
@media (max-width:480px){.end-stats{grid-template-columns:repeat(2,1fr)}}
.ledger{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.ledger div{display:flex;justify-content:space-between;font-size:14px;color:var(--mist);border-bottom:1px dotted rgba(147,180,174,.15);padding:3px 0}
.ledger div.sum{color:var(--lamp-soft);font-size:18px;font-weight:900;border:none;padding-top:8px}
.unlock{margin:0;color:var(--gold);font-size:14px}

/* shop */
.shop-wrap{width:100%;max-width:980px;display:flex;flex-direction:column;gap:20px}
.shop-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px}
.shop-head h2{font-family:var(--font-display);font-weight:400;font-size:clamp(44px,8vw,64px);line-height:1;margin:0;color:var(--lamp-soft);text-shadow:0 0 24px rgba(243,182,92,.4)}
.shop-head p{margin:0;color:var(--mist);font-size:14px;flex:1 1 220px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mt{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;align-items:start;padding:14px;background:rgba(236,223,189,.05);border:1px solid rgba(236,223,189,.13);border-radius:3px}
.mt .seal{grid-row:span 3;width:42px;height:42px;font-size:28px}
.mt .nm{font-weight:900;line-height:1.3}
.mt .ds{font-size:13px;color:var(--mist);line-height:1.5}
.pips{display:flex;gap:3px;margin-top:3px}
.pip{width:14px;height:4px;background:rgba(147,180,174,.22)}
.pip.on{background:var(--lamp)}
.mt .btn{grid-column:1/-1;margin-top:8px;padding:7px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.codex{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cx{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;padding:10px 12px;border:1px dashed rgba(147,180,174,.2);border-radius:3px}
.cx .seal{grid-row:span 2;width:36px;height:36px;font-size:24px;background:#26343a;color:var(--mist-dim)}
.cx.on{border-style:solid;border-color:rgba(242,207,107,.4);background:rgba(242,207,107,.05)}
.cx.on .seal{background:linear-gradient(135deg,var(--gold),var(--ember));color:var(--paper-ink)}
.cx .nm{font-weight:600}
.cx .rc{font-size:12px;color:var(--mist)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="game" aria-label="守灯人游戏画面"></canvas>

<div id="hud" hidden>
  <div class="xpbar"><div id="xpfill"></div></div>
  <div class="hud-top">
    <div class="hud-left">
      <div class="lvl" id="lvl">Lv 1</div>
      <div id="slots"></div>
    </div>
    <div class="hud-mid"><div class="clock" id="clock">00:00</div><div class="phase" id="phase">一更</div></div>
    <div class="hud-right">
      <div class="stat"><small>斩</small><span id="kills">0</span></div>
      <div class="stat"><small>烬</small><span id="hudEmbers">0</span></div>
      <button class="iconbtn" id="pauseBtn" type="button">暂停</button>
    </div>
  </div>
  <div id="bossbar" hidden><div class="bb-name" id="bossName"></div><div class="bb-track"><div id="bossFill"></div></div></div>
  <button id="dashBtn" type="button" aria-label="冲刺">冲</button>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<section id="menu" class="screen">
  <div class="menu-inner">
    <header class="brand">
      <h1>守灯人</h1>
      <p class="tag">长夜五更，守住手里这盏灯，等到天亮。</p>
      <p class="how">武器会自己出手。拾起萤火升级，挑选武器和随身物。武器满级后，带上与它共鸣的随身物，就能在升级或开宝箱时觉醒。每一夜攒下的余烬，可以在灯坊换成永久的本事。</p>
    </header>
    <div>
      <h2 class="sec-h">守夜人</h2>
      <div id="charList"></div>
    </div>
    <div>
      <h2 class="sec-h">夜深</h2>
      <div id="nightSel"></div>
      <p class="note" id="nightDesc"></p>
    </div>
    <div class="menu-actions">
      <button class="btn primary" id="startBtn" type="button">点灯 · 开始守夜</button>
      <button class="btn" id="shopBtn" type="button">灯坊</button>
      <span class="purse">余烬<b id="menuEmbers">0</b></span>
      <button class="btn ghost" id="soundBtn" type="button">音效：开</button>
    </div>
    <p class="records" id="records"></p>

/* menu backdrop */

function renderMenuScene(dt) {

  const wx = demo.t * 12, wy = demo.t * 4, ox = cx - wx, oy = cy - wy;

  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(wx, wy, 0, wx, wy, LR); g.addColorStop(0, 'rgba(255,168,80,.16)'); g.addColorStop(1, 'rgba(255,140,60,0)'); ctx.fillStyle = g; circle(wx, wy, LR);
  ctx.fillStyle = 'rgba(255,210,120,.35)'; circle(wx + 14, wy - 6, 9); ctx.fillStyle = 'rgba(255,230,170,.8)'; circle(wx + 14, wy - 6, 3);
  for (let i = 0; i < 5; i++) { const a = demo.t * .6 + i * 1.3, x = wx + Math.cos(a) * (120 + i * 20), y = wy + Math.sin(a * 1.3) * 80; ctx.fillStyle = 'rgba(255,214,110,.25)'; circle(x, y, 7); ctx.fillStyle = '#ffe08a'; circle(x, y, 2.2); }
  for (const e of demo.eyes) {

/* =================== loop =================== */
let last = 0;
